name: Publish Storm DLC

on:
  push:
    branches: [main]
    paths:
      - 'gradle.properties'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storm-dlc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build the release JAR without tests
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "$TAG" ]]; then
            VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
            TAG="v$VERSION"
          else
            VERSION="${TAG#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Use a tag such as v2.0.2+1.21.4."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assemble -x test -x compileTestJava -x processTestResources --console=plain "-Pmod_version=$VERSION" "-Pupdates_repository=$REPOSITORY"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Publish release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$RELEASE_TAG"
          MOD_JAR="build/libs/storm-dlc-$RELEASE_VERSION.jar"
          SOURCES_JAR="build/libs/storm-dlc-$RELEASE_VERSION-sources.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MOD_JAR" "$SOURCES_JAR" --clobber
          else
            gh release create "$TAG" "$MOD_JAR" "$SOURCES_JAR" --target "$GITHUB_SHA" \
              --title "Storm DLC $RELEASE_VERSION" --generate-notes
          fi
